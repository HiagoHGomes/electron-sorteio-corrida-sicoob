<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sorteio Corrida Sicoob</title>
    <link rel="stylesheet" href="../style.css">

        <header>

            <div>

                    <tr>
                        <th>Nº DE PEITO</th>

                    <tr>
                        <td class="nPeito">1235</td>
